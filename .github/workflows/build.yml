name: Build Minecraft 1.12.2 mod
on:
  push:
    branches: ['arena/dcab859f-444']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # Launcher-only commits and release-note repairs do not rebuild the mod.
    if: ${{ !contains(github.event.head_commit.message, '[launcher-test]') && !contains(github.event.head_commit.message, '[publish menu-docs]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install asset-generation dependency
        run: python -m pip install -r tools/requirements.txt
      - name: Validate imported content
        run: |
          python - <<'PYTEST'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for case, trace in result.failures + result.errors:
              message = trace[-4500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=' + case.id() + '::' + message)
          print('::notice title=Python results::' + str(result.testsRun) + ' tests; ' + str(len(result.failures)) + ' failures; ' + str(len(result.errors)) + ' errors')
          sys.exit(0 if result.wasSuccessful() else 1)
          PYTEST
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile and verify donor Germo rules independently of Forge
        shell: bash
        run: |
          mkdir -p .cache/germo-check
          javac -source 8 -target 8 -d .cache/germo-check \
            src/main/java/ru/metrocraft/port/metromod/decor/DonorGermoBlockRules.java \
            src/main/java/ru/metrocraft/port/metromod/decor/DonorGermoMotion.java \
            src/main/java/ru/metrocraft/port/metromod/decor/DonorGermoCoordinates.java \
            src/test/java/ru/metrocraft/port/metromod/decor/DonorGermoMotionCheck.java \
            src/test/java/ru/metrocraft/port/metromod/decor/DonorGermoStandaloneCheck.java
          java -cp .cache/germo-check ru.metrocraft.port.metromod.decor.DonorGermoStandaloneCheck \
            src/test/resources/metromod_germo_callbacks.tsv
          java -cp .cache/germo-check ru.metrocraft.port.metromod.decor.DonorGermoMotionCheck \
            src/test/resources/metromod_germo_callbacks.tsv
      - name: Verify original menu scene transforms without Forge or OpenGL
        shell: bash
        run: |
          mkdir -p .cache/menu-scene-check
          javac -source 8 -target 8 -d .cache/menu-scene-check \
            src/main/java/ru/metrocraft/port/client/menu/OriginalMenuState.java \
            src/main/java/ru/metrocraft/port/client/menu/OriginalMenuGeometry.java \
            src/main/java/ru/metrocraft/port/client/menu/OriginalMenuScene.java \
            src/test/java/ru/metrocraft/port/client/menu/OriginalMenuSceneCheck.java
          java -cp .cache/menu-scene-check ru.metrocraft.port.client.menu.OriginalMenuSceneCheck
      - uses: actions/cache/restore@v4
        id: forge-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .cache/forge-maven
          key: minetro-forge1122-${{ runner.os }}-${{ github.run_id }}
          restore-keys: minetro-forge1122-${{ runner.os }}-
      - name: Start official Forge Maven transport cache
        shell: bash
        run: |
          mkdir -p .cache
          python -u tools/forge_maven_proxy.py --cache .cache/forge-maven > .cache/forge-maven-proxy.log 2>&1 &
          echo "$!" > .cache/forge-maven-proxy.pid
      - name: Build and reobfuscate for Forge
        shell: bash
        env:
          MINETRO_FORGE_MAVEN_PROXY: http://127.0.0.1:18765/
        run: |
          set +e
          ./gradlew --init-script tools/forge_ci.init.gradle -Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.internal.http.connectionTimeout=10000 --no-daemon build > build-output.log 2>&1
          result=$?
          cat build-output.log
          if [ "$result" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('build/test-results/test').glob('TEST-*.xml'):
              suite = ET.parse(report).getroot()
              for case in suite.findall('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      text = failure.text or failure.get('message', 'Test failure')
                      message = text if len(text) <= 4500 else text[:1800] + '\n...\n' + text[-2700:]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=' + case.get('classname', '') + '.' + case.get('name', '') + '::' + message)
          log = Path('build-output.log').read_text(errors='replace')[-3500:]
          log = log.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Forge build failed::' + log)
          PY
          fi
          exit "$result"
      - name: Stop dependency helper and show download diagnostics
        if: always()
        run: |
          if [ -f .cache/forge-maven-proxy.pid ]; then kill "$(cat .cache/forge-maven-proxy.pid)" || true; fi
          if [ -f .cache/forge-maven-proxy.log ]; then tail -80 .cache/forge-maven-proxy.log; fi
      - uses: actions/cache/save@v4
        if: always() && steps.forge-cache.outcome == 'success'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .cache/forge-maven
          key: minetro-forge1122-${{ runner.os }}-${{ github.run_id }}
      - name: Verify reduced distribution and retained model dependencies
        run: python tools/verify_reduced_jar.py build/libs/metrocraft-port-1.12.2-1.13.0-dev.42.jar
      - name: Report JUnit results
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('build/test-results/test').glob('TEST-*.xml')]
          if suites:
              totals = {key: sum(int(s.get(key, '0')) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
              text = ', '.join(str(value) + ' ' + key for key, value in totals.items())
              print('::notice title=JUnit results::' + text)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## JUnit results\n\n' + text + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metrocraft-port-1.12.2
          path: build/libs/metrocraft-port-1.12.2-1.13.0-dev.42.jar
          if-no-files-found: error

      - name: Publish verified v12 magazine inventory support build
        if: github.ref == 'refs/heads/arena/dcab859f-444' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish arsenal-v12]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/arena/dcab859f-444 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PYREPORT'
          import hashlib, json, os, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          jar = Path('build/libs/metrocraft-port-1.12.2-1.13.0-dev.42.jar')
          suites = [ET.parse(p).getroot() for p in Path('build/test-results/test').glob('TEST-*.xml')]
          assert suites and all(int(s.get('failures', '0')) == 0 and int(s.get('errors', '0')) == 0 for s in suites)
          with zipfile.ZipFile(jar) as z:
              assert {'ru/metrocraft/port/inventory/PackingGrid.class', 'ru/metrocraft/port/inventory/GridClickPacket.class', 'ru/metrocraft/port/inventory/CarryWeight.class', 'assets/metroport/inventory_balance.json'} <= set(z.namelist())
              from tools.configure_inventory_grid import WEAPON_RARITIES
              balance = json.loads(z.read('assets/metroport/inventory_balance.json'))
              assert all(balance['items']['modularwarfare:metro_'+gun]['rarity'] == tier for gun, tier in WEAPON_RARITIES.items())
              assert balance['categories']['patch']['grams']==100
              assert balance['items']['metroport:mcmod_watch']['rarity']=='epic'
              assert all(balance['items']['metroport:'+id]['grams']==grams for id,grams in {'armorrem':3000,'remkomplekt':3000,'kanistra':6000}.items())
              assert {'ru/metrocraft/port/client/MetroChestGui.class','ru/metrocraft/port/client/EquipmentLayers.class','ru/metrocraft/port/client/OverloadInput.class'} <= set(z.namelist())
              assert 'assets/metroport/models/item/remkomplekt.json' in z.namelist()
              assert not any(n.startswith('com/modularwarfare/') for n in z.namelist()), 'Test fixtures must not ship'
          report = dict(version='1.13.0-dev.42', sourceCommit=os.environ['GITHUB_SHA'],
              buildUrl='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              jar=jar.name, bytes=jar.stat().st_size, sha256=hashlib.sha256(jar.read_bytes()).hexdigest(),
              junitTests=sum(int(s.get('tests', '0')) for s in suites), junitFailures=0, junitErrors=0,
              weaponRaritiesVerified=len(WEAPON_RARITIES),
              minecraftLiveTested=False, mwfLiveTested=False)
          Path('build/MinETRO_inventory_dev42_report.json').write_text(json.dumps(report, indent=2)+'\n')
          PYREPORT
          gh release create minetro-inventory-dev42 --target "$GITHUB_SHA" --prerelease \
            --title 'MinETRO dev42 — new arsenal inventory support TEST' \
            --notes-file docs/ARSENAL_V12_RU.md \
            build/libs/metrocraft-port-1.12.2-1.13.0-dev.42.jar \
            build/MinETRO_inventory_dev42_report.json docs/ARSENAL_V12_RU.md docs/WEAPON_RARITIES_DEV36_RU.md

      - name: Verify and publish original menu runtime test
        if: github.ref == 'refs/heads/arena/dcab859f-444' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish menu-test]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/arena/dcab859f-444 | cut -f1)" = "$GITHUB_SHA"
          mkdir -p downloads
          python -m tools.verify_metromod_menu_build \
            build/libs/metrocraft-port-1.12.2-1.13.0-dev.33.jar build/test-results/test "$GITHUB_SHA" \
            "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" downloads/MetroPort_dev33_report.json
          cp docs/METRO_MENU_DEV33_RU.txt downloads/MetroPort_dev33_README_RU.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/MetroPort_dev33_report.json downloads/MetroPort_dev33_README_RU.txt
          git diff --cached --check
          git commit -m 'Record verified original menu runtime test dev33 [skip ci]'
          git push origin arena/dcab859f-444
          gh release create minetro-menu-dev33 --target "$GITHUB_SHA" --prerelease \
            --title 'MinETRO dev33 — original 3D menu runtime TEST' \
            --notes-file docs/METRO_MENU_DEV33_RU.txt \
            build/libs/metrocraft-port-1.12.2-1.13.0-dev.33.jar \
            downloads/MetroPort_dev33_report.json downloads/MetroPort_dev33_README_RU.txt

  publish-menu-docs:
    if: github.ref == 'refs/heads/arena/dcab859f-444' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish menu-docs]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/METRO_MENU_DEV33_RU.txt
            /downloads/MetroPort_dev33_README_RU.txt
            /downloads/MetroPort_dev33_report.json
      - name: Update only dev33 release instructions, retain verified JAR and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cmp docs/METRO_MENU_DEV33_RU.txt downloads/MetroPort_dev33_README_RU.txt
          grep -q '1.13.0-dev.33' docs/METRO_MENU_DEV33_RU.txt
          grep -q 'F6' docs/METRO_MENU_DEV33_RU.txt
          gh release edit minetro-menu-dev33 --notes-file docs/METRO_MENU_DEV33_RU.txt
          gh release upload minetro-menu-dev33 downloads/MetroPort_dev33_README_RU.txt --clobber
