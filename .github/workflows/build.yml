name: Build Minecraft 1.12.2 mod
on:
  push:
    branches: ['arena/dcab859f-444']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate imported content
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build and reobfuscate for Forge
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: metrocraft-port-1.12.2
          path: build/libs/metrocraft-port-1.12.2-1.0.0.jar
          if-no-files-found: error
