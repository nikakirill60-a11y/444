name: Build Minecraft 1.12.2 mod
on:
  push:
    branches: ['arena/dcab859f-444']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install asset-generation dependency
        run: python -m pip install -r tools/requirements.txt
      - name: Validate imported content
        run: |
          python - <<'PYTEST'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for case, trace in result.failures + result.errors:
              message = trace[-4500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=' + case.id() + '::' + message)
          print('::notice title=Python results::' + str(result.testsRun) + ' tests; ' + str(len(result.failures)) + ' failures; ' + str(len(result.errors)) + ' errors')
          sys.exit(0 if result.wasSuccessful() else 1)
          PYTEST
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Build and reobfuscate for Forge
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon build > build-output.log 2>&1
          result=$?
          cat build-output.log
          if [ "$result" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('build/test-results/test').glob('TEST-*.xml'):
              suite = ET.parse(report).getroot()
              for case in suite.findall('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      text = failure.text or failure.get('message', 'Test failure')
                      message = text if len(text) <= 4500 else text[:1800] + '\n...\n' + text[-2700:]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=' + case.get('classname', '') + '.' + case.get('name', '') + '::' + message)
          log = Path('build-output.log').read_text(errors='replace')[-3500:]
          log = log.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Forge build failed::' + log)
          PY
          fi
          exit "$result"
      - name: Report JUnit results
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('build/test-results/test').glob('TEST-*.xml')]
          if suites:
              totals = {key: sum(int(s.get(key, '0')) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
              text = ', '.join(str(value) + ' ' + key for key, value in totals.items())
              print('::notice title=JUnit results::' + text)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## JUnit results\n\n' + text + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metrocraft-port-1.12.2
          path: build/libs/metrocraft-port-1.12.2-1.13.0-dev.15.jar
          if-no-files-found: error
