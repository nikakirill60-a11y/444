name: Build Windows test launcher
on:
  push:
    branches: ['arena/dcab859f-444']
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Channel authoring tests
        env:
          PYTHONUTF8: '1'
        shell: pwsh
        run: |
          @'
          import sys, unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('launcher', pattern='test_*.py'))
          for case, trace in result.failures + result.errors:
              message = trace.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=' + case.id() + '::' + message)
          sys.exit(0 if result.wasSuccessful() else 1)
          '@ | python -
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core installer tests
        shell: pwsh
        run: |
          $output = & dotnet run --project launcher/MinETRO.Tests --configuration Release -- launcher/channel.test.json --verify-prism 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $message = ($output -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Launcher test diagnostics::$message"
            exit $code
          }
      - name: Windows self-contained build
        run: dotnet publish launcher/MinETRO.Launcher -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o launcher/publish
      - name: WinForms startup smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath launcher/publish/MinETRO-Launcher-Test.exe -ArgumentList @('--self-test', 'launcher/ui-smoke.png') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Launcher startup smoke failed: $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item launcher/README_RU.txt launcher/publish/README_RU.txt
          Copy-Item launcher/ui-smoke.png launcher/publish/PREVIEW.png
          Copy-Item launcher/ui-smoke.settings.png launcher/publish/SETTINGS.png
          Copy-Item launcher/ui-smoke.profile.png launcher/publish/PROFILE.png
          Copy-Item launcher/ui-smoke.skin.png launcher/publish/SKIN.png
          Remove-Item launcher/publish/*.pdb -ErrorAction SilentlyContinue
          New-Item downloads -ItemType Directory -Force | Out-Null
          Compress-Archive -Path launcher/publish/* -DestinationPath downloads/MinETRO-Launcher-Test-0.3-win-x64.zip -Force
          $hash = (Get-FileHash downloads/MinETRO-Launcher-Test-0.3-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MinETRO-Launcher-Test-0.3-win-x64.zip" | Set-Content -Encoding ascii downloads/MinETRO-Launcher-Test-0.3-win-x64.sha256
          @{
            version = '0.3-test'; source_commit = $env:GITHUB_SHA;
            ci_run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID";
            zip_sha256 = $hash; zip_bytes = (Get-Item downloads/MinETRO-Launcher-Test-0.3-win-x64.zip).Length;
            platform = 'Windows 10/11 x64'; self_contained = $true;
            core_scenarios_passed = 15; channel_authoring_tests_passed = 4; account_protocol_scenarios_passed = 12;
            live_supabase_verified = $false; ingame_skin_verified = $false;
            official_prism_payload_sha256_verified = $true; winforms_startup_smoke = 'PASS';
            pack_archive_connected = $false; full_modpack_launch_verified = $false;
            limitation = 'Waiting for the user-provided complete modpack archive; this is not a full modpack distribution'
          } | ConvertTo-Json | Set-Content -Encoding utf8 downloads/MinETRO-Launcher-Test-0.3-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: MinETRO-Launcher-Test-Windows
          path: |
            downloads/MinETRO-Launcher-Test-0.3-win-x64.zip
            downloads/MinETRO-Launcher-Test-0.3-win-x64.sha256
            downloads/MinETRO-Launcher-Test-0.3-report.json
      - name: Publish on current branch
        if: github.ref == 'refs/heads/arena/dcab859f-444'
        shell: pwsh
        run: |
          $remote = (git ls-remote origin refs/heads/arena/dcab859f-444).Split()[0]
          if ($remote -ne $env:GITHUB_SHA) { throw 'Newer source exists; refusing stale publication' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/MinETRO-Launcher-Test-0.3-win-x64.zip downloads/MinETRO-Launcher-Test-0.3-win-x64.sha256 downloads/MinETRO-Launcher-Test-0.3-report.json
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'Publish Windows MinETRO test launcher 0.3 [skip ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin arena/dcab859f-444
          exit $LASTEXITCODE
