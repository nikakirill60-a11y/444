name: Recover remaining supplied native weapon assets
on:
  push:
    branches: ['arena/dcab859f-444']
    paths: ['.github/workflows/recover-blackrazid-assets.yml', 'tools/recover_blackrazid_weapon_assets.py']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/dcab859f-444
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install gdown==5.2.0
      - name: Recover available originals, preserving source provenance
        run: python tools/recover_blackrazid_weapon_assets.py
      - name: Save reference-only originals on the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/blackrazid-reference/assets/weapons tools/blackrazid-reference/weapons-model-source-files.json docs/blackrazid-weapon-source-recovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Recover remaining available native weapon originals, not runtime completion'
            git pull --rebase origin arena/dcab859f-444
            git push origin arena/dcab859f-444
          fi
