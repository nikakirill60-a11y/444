buildscript {
    repositories {
        // Resolve ordinary Gradle dependencies from Central first. A Forge Maven
        // reset must not poison resolution of unrelated parent POMs.
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
// Put Central before repositories installed by the legacy Forge plugin, too.
repositories { mavenCentral() }
apply plugin: 'net.minecraftforge.gradle'

version = '1.13.0-dev.41'
group = 'ru.metrocraft'
archivesBaseName = 'metrocraft-port-1.12.2'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    runs {
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run') }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:2.28.2'
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
}

test {
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'MinETRO',
                   'Implementation-Version': project.version
    }
}

// Reduced distribution: retain source references for integrity tests, omit retired meshes/items from the JAR.
jar {
    def reduced = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/metroport/reduced_scope.json'))
    reduced.jarExcludes.each { pattern -> exclude pattern }
}

// Tests retain the historical donor fixtures. Only the six lever profiles ship.
def leverResourceDir = file("$buildDir/lever-resources")
def decorReplacements = ['metromod_gates.json', 'metromod_interactive.json', 'metromod_layout.json', 'metromod_ground.json']
task prepareLeverResources {
    inputs.files decorReplacements.collect { file('src/main/resources/assets/metroport/' + it) }
    outputs.dir leverResourceDir
    doLast {
        def source = file('src/main/resources/assets/metroport')
        def json = new groovy.json.JsonSlurper()
        def levers = json.parse(new File(source, 'metromod_interactive.json')).findAll { it.kind == 'Lever' }
        def ids = levers.collect { it.id } as Set
        def layout = json.parse(new File(source, 'metromod_layout.json')).findAll { key, value -> ids.contains(key) }
        def output = new File(leverResourceDir, 'assets/metroport'); output.mkdirs()
        ['metromod_gates.json': [], 'metromod_interactive.json': levers,
         'metromod_layout.json': layout, 'metromod_ground.json': [:]].each { name, value ->
            new File(output, name).setText(groovy.json.JsonOutput.toJson(value) + '\n', 'UTF-8')
        }
    }
}
jar {
    dependsOn prepareLeverResources
    // A path-only exclude would also exclude the replacement. Check the input file.
    exclude { details ->
        decorReplacements.any { details.path == 'assets/metroport/' + it } &&
            !details.file.toPath().startsWith(leverResourceDir.toPath())
    }
    from leverResourceDir
}

// New registry IDs resolve existing art without duplicating meshes/textures or restoring removed models.
def namespaceAliasDir = file("$buildDir/namespace-aliases")
task prepareNamespaceAliases {
    inputs.dir file('src/main/resources/assets/metroport')
    inputs.file file('src/main/resources/assets/metroport/reduced_scope.json')
    outputs.dir namespaceAliasDir
    doLast {
        delete namespaceAliasDir
        def source = file('src/main/resources/assets/metroport')
        def reduced = new groovy.json.JsonSlurper().parse(new File(source, 'reduced_scope.json'))
        fileTree(source).matching { include 'models/**/*.json', 'blockstates/*.json', 'sounds.json' }.each { input ->
            def relative = source.toPath().relativize(input.toPath()).toString().replace('\\', '/')
            def full = 'assets/metroport/' + relative
            if (!reduced.jarExcludes.any { org.apache.tools.ant.types.selectors.SelectorUtils.matchPath(it, full) }) {
                def target = new File(namespaceAliasDir, 'assets/minetro/' + relative)
                target.parentFile.mkdirs();target.bytes=input.bytes
            }
        }
        fileTree(new File(source, 'lang')).matching { include '*.lang' }.each { input ->
            def target = new File(namespaceAliasDir, 'assets/minetro/lang/' + input.name)
            target.parentFile.mkdirs()
            target.setText(input.readLines('UTF-8').collect { line ->
                int equals=line.indexOf('=')
                equals<0?line:line.substring(0,equals).replace('metroport.', 'minetro.')+line.substring(equals)
            }.join('\n')+'\n','UTF-8')
        }
    }
}
jar { dependsOn prepareNamespaceAliases; from namespaceAliasDir }
